apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

/**
 * Resolve a release-signing credential as EITHER a Gradle property (~/.gradle/gradle.properties,
 * or -P) OR a plain environment variable of the same name.
 *
 * findProperty alone does NOT see exported env vars — only ORG_GRADLE_PROJECT_* — so a release
 * job that exported RELEASE_STORE_FILE=... would silently fall through to the debug key and
 * produce an APK that looks fine and can never be updated in place. Blank resolves to null so an
 * empty value cannot half-configure the signing config. Lifted from Peers, where this exact
 * footgun is issue #356.
 *
 * The names are deliberately NODE_REMOTE_-prefixed. A bare RELEASE_STORE_FILE is already set
 * GLOBALLY in ~/.gradle/gradle.properties on the maintainer's machine, pointing at the Peers
 * keystore — so an unprefixed name silently signs THIS app with PEERS' key. Verified, not
 * theorised: the first release build here came out as "CN=Peers, O=Peers, C=US".
 */
ext.releaseSigningCredential = { String name ->
    def value = project.findProperty(name) ?: System.getenv(name)
    def resolved = value?.toString()?.trim()
    return resolved ? resolved : null
}

android {
    namespace "co.logos.noderemote"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "co.logos.noderemote"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.2.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Production key. Supplied by the maintainer via properties or env vars and NEVER
        // committed — see docs/SIGNING.md. Only populated when a keystore path is given, so
        // ordinary dev builds still work with no setup.
        release {
            def storeFilePath = releaseSigningCredential('NODE_REMOTE_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword releaseSigningCredential('NODE_REMOTE_RELEASE_STORE_PASSWORD')
                keyAlias releaseSigningCredential('NODE_REMOTE_RELEASE_KEY_ALIAS')
                keyPassword releaseSigningCredential('NODE_REMOTE_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // Sign with the production key when it is configured; fall back to debug for
            // local builds. A distributable release passes -PassertReleaseSigned, which turns
            // that fallback into a HARD FAILURE.
            //
            // This matters more than it looks: Android identifies an app by its signing key,
            // so a debug-signed APK published to F-Droid can never be upgraded in place by the
            // real one. Every installed user would have to uninstall and lose their pairing.
            // The guard reads the SAME resolved value the signing config uses, so the two
            // cannot disagree about whether the key is present.
            if (releaseSigningCredential('NODE_REMOTE_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                if (project.hasProperty('assertReleaseSigned')) {
                    throw new GradleException(
                        "NODE_REMOTE_RELEASE_STORE_FILE not set — refusing to ship a DEBUG-SIGNED release. " +
                        "Configure the production keystore (docs/SIGNING.md).")
                }
                logger.warn(
                    "NODE_REMOTE_RELEASE_STORE_FILE not set — release APK is DEBUG-SIGNED (dev only, NOT " +
                    "for distribution). See docs/SIGNING.md.")
                signingConfig signingConfigs.debug
            }
        }
    }

    // kmp-tor's exec path runs the tor BINARY. Android blocks exec from the app data dir
    // on API 28+, so the binary must live in nativeLibraryDir — which only happens when
    // jniLibs are NOT compressed into the APK. Lifted from receiver-android, where this
    // exact line is what made embedded Tor work at all.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"

    // Embedded Tor, standalone (no Orbot). Same versions receiver-android ships.
    implementation "io.matthewnelson.kmp-tor:runtime:2.6.0"
    implementation "io.matthewnelson.kmp-tor:resource-exec-tor:408.22.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // QR scanning. ZXing, NOT ML Kit: this app targets F-Droid, which requires FOSS, and
    // ML Kit ships proprietary blobs. ZXing also works with no Play Services at all, which
    // matters on GrapheneOS.
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // JVM unit tests for the pure state logic (NodeState parse/helpers + Transitions).
    // org.json is provided by the Android framework at runtime but not on the plain-JVM
    // unit-test classpath, so it is added explicitly (same API).
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
