apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "co.logos.noderemote"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "co.logos.noderemote"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    // kmp-tor's exec path runs the tor BINARY. Android blocks exec from the app data dir
    // on API 28+, so the binary must live in nativeLibraryDir — which only happens when
    // jniLibs are NOT compressed into the APK. Lifted from receiver-android, where this
    // exact line is what made embedded Tor work at all.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"

    // Embedded Tor, standalone (no Orbot). Same versions receiver-android ships.
    implementation "io.matthewnelson.kmp-tor:runtime:2.6.0"
    implementation "io.matthewnelson.kmp-tor:resource-exec-tor:408.22.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // QR scanning. ZXing, NOT ML Kit: this app targets F-Droid, which requires FOSS, and
    // ML Kit ships proprietary blobs. ZXing also works with no Play Services at all, which
    // matters on GrapheneOS.
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}
